<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DSA Strategy Hub - Placement & Off-Campus Hiring Preparation with Java Solutions, Socratic Hint Ladders, Spaced Revision, and Adaptive Study Planner" />
    <title>DSA Strategy Hub | Placement & Off-Campus Prep</title>
    <!-- Google Fonts Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      #nl-badge,
      .nl-badge,
      [id^="nl-badge"],
      [class*="nl-badge"],
      #netlify-drawer,
      [data-netlify-drawer],
      [data-netlify-feedback],
      iframe[src*="netlify"],
      button[aria-label*="Netlify"],
      button[title*="Netlify"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        top: -9999px !important;
        left: -9999px !important;
        z-index: -9999 !important;
      }
    </style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('dsa_hub_theme_v1');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}

        function removeNetlifyBadge() {
          var badges = document.querySelectorAll('#nl-badge, .nl-badge, [id^="nl-badge"], [class*="nl-badge"], #netlify-drawer, [data-netlify-drawer]');
          badges.forEach(function(el) {
            if (el && el.parentNode) {
              el.parentNode.removeChild(el);
            }
          });
        }
        if (typeof document !== 'undefined') {
          document.addEventListener('DOMContentLoaded', removeNetlifyBadge);
          window.addEventListener('load', removeNetlifyBadge);
          try {
            var observer = new MutationObserver(removeNetlifyBadge);
            observer.observe(document.documentElement, { childList: true, subtree: true });
          } catch(err) {}
        }
      })();
    </script>
  </head>
  <body class="bg-[#FAF6EE] text-[#18181B] dark:bg-[#121316] dark:text-[#F4F4F5] min-h-screen antialiased selection:bg-[#FFDE59] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
